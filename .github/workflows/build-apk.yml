name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is missing"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Restore signing key
        env:
          INDEX_KEYSTORE_BASE64: ${{ secrets.INDEX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$INDEX_KEYSTORE_BASE64" ]; then
            echo "::error::INDEX_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$INDEX_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/index-release.jks"
          echo "INDEX_STORE_FILE=$RUNNER_TEMP/index-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          INDEX_STORE_PASSWORD: ${{ secrets.INDEX_STORE_PASSWORD }}
          INDEX_KEY_ALIAS: ${{ secrets.INDEX_KEY_ALIAS }}
          INDEX_KEY_PASSWORD: ${{ secrets.INDEX_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Check the APK is signed
        run: |
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "::error::Signed app-release.apk not found — the signing secrets are wrong or incomplete"
            ls app/build/outputs/apk/release/ || true
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: INDEX-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release (main branch only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" app/build/outputs/apk/release/app-release.apk --clobber
          else
            gh release create "$TAG" app/build/outputs/apk/release/app-release.apk \
              --title "INDEX $TAG" \
              --notes "INDEX for the class. Download app-release.apk and install it — updates install over the previous version, your data stays."
          fi
